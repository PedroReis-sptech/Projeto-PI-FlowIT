<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tela de Gerente - Flow</title>
    <link rel="stylesheet" href="css/stylesGestao.css">
</head>
<body>

    <div class="cabecalho">
        <div id="div_flow" class="logo">
            <img src="assets/imagens/Flow-removebg-preview.png" alt="Descrição" style="width:100%;">
        </div>
        <div class="links">
            <a href="dashboard/dashboard_gerente.html">DASHBOARD</a>
            <a href="tela-gestao.html">GESTÃO DE USUÁRIO</a>
            <a href="#" class="link-ativo">GESTÃO DE SETOR</a>
        </div>
        <div class="botoes-topo">
            <button class="botao-sair" onclick="sairTela()">Sair</button>
        </div>
    </div>

    <div class="corpo-da-pagina">
        
        <div class="quadrado-cadastro">
            <h3>ADICIONAR SETOR</h3>
            
            <input type="text" id="campoSetor" placeholder="NOME DO SETOR">
            <input type="corredor" id="campoCorredor" placeholder="Corredor">
            <input type="corredor" id="campoMeta" placeholder="Meta do setor">

            <button onclick="adicionarSetor()" class="botao-add"> + ADICIONAR SETOR </button>
        </div>

        <div class="quadrado-lista">
            <h3>LISTA DE SETORES ADICIONADOS</h3>
            <table>
                <thead>
                    <tr>
                        <th>NOME</th>
                        <th>CORREDOR</th>
                        <th>META</th>
                        <th>DESEJA DELETAR?</th>
                    </tr>
                </thead>
                <tbody id="tabelaSetores">
                    </tbody>
            </table>
        </div>

    </div>

</body>
</html>

<script>
let listaDeSetor = [];

function adicionarSetor() {
    let nome = campoSetor.value;
    let corredor = campoCorredor.value;
    let meta = campoMeta.value;

    if (nome == "" || corredor == "" || meta == "") {
        alert("Por favor, preencha todos os campos!");
        return;
    }

    let novo = {
        nomeFunc: nome,
        corredorFunc: corredor,
        metaFunc: meta
    };

    listaDeSetor.push(novo);

    campoSetor.value = "";
    campoCorredor.value = "";
    campoMeta.value = "";

    mostrarNaTela();
}

function mostrarNaTela() {
    let tabela = tabelaSetores;
    tabela.innerHTML = "";

    for (let i = 0; i < listaDeSetor.length; i++) {
        let setor = listaDeSetor[i];

        tabela.innerHTML += `
            <tr>
                <td>${setor.nomeFunc}</td>
                <td>${setor.corredorFunc}</td>
                <td>${setor.metaFunc}</td>
                <td>
                    <button class="botao-excluir" onclick="remover(${i})">Excluir</button>
                </td>
            </tr>
        `;
    }
}

function sairTela() {
    if (confirm("Deseja sair desta tela?")) {
    window.location.href = "../Site Institucional/index.html";
} 
}

function remover(posicao) {
    listaDeSetor.splice(posicao, 1);
    mostrarNaTela();
}
</script>
