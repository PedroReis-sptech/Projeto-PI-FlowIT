<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tela de Gerente - Flow</title>
    <link rel="stylesheet" href="css/stylesGestao.css">
</head>
<body>

    <div class="cabecalho">
        <div id="div_flow" class="logo">
            <img src="assets/imagens/Flow-removebg-preview.png" alt="Descrição" style="width:100%;">
        </div>
        <div class="links">
            <a href="dashboard/dashboard_gerente.html">DASHBOARD</a>
            <a href="tela-gestao.html">GESTÃO DE USUÁRIO</a>
            <a href="#" class="link-ativo">GESTÃO DE SETOR</a>
        </div>
        <div class="botoes-topo">
            <button class="botao-sair" onclick="sairTela()">Sair</button>
        </div>
    </div>

    <div class="corpo-da-pagina">
        
        <div class="quadrado-cadastro">
            <h3>ADICIONAR SETOR</h3>
            
            <input type="text" id="campoSetor" placeholder="NOME DO SETOR">
            <input type="text" id="campoCorredor" placeholder="NÚMERO DO CORREDOR">
            <input type="number" id="campoMeta" placeholder="Meta do setor">

            <button onclick="adicionarSetor()" class="botao-add"> ADICIONAR SETOR </button>
        </div>

        <div class="quadrado-lista">
            <h3>LISTA DE SETORES</h3>
            <table>
                <thead>
                    <tr>
                        <th>NOME</th>
                        <th>CORREDOR</th>
                        <th>META</th>
                        <th>DESEJA DELETAR?</th>
                    </tr>
                </thead>
                <tbody id="tabelaSetores">
                    </tbody>
            </table>
        </div>

    </div>

</body>
</html>

<script>
    let loja = {
        setores: []
    };

    var codigoLoja = sessionStorage.ID_LOJA;

    if (!codigoLoja) {
        console.log("ID da loja não encontrado no sessionStorage.");
    } else {
        obterSetores();
    }

    function obterSetores() {
        fetch(`/gestao/listarSetores/${codigoLoja}`, { cache: 'no-store' })
            .then(function(resposta) {
                if (resposta.ok) {
                    resposta.json().then(function(setor) {
                        console.log(`Dados recebidos: ${JSON.stringify(setor)}`);
                        loja.setores = setor;
                        exibirSetor();
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
            .catch(function(erro) {
                console.error(`Erro na obtenção dos setores: ${erro.message}`);
            });
    }

    function excluirSetor(idSetor) {
        if (confirm("Tem certeza que deseja excluir este setor?")) {
            fetch(`/gestao/deletarSetor/${idSetor}`, { 
                method: 'DELETE',
                cache: 'no-store' 
            })
            .then(function(resposta) {
                if (resposta.ok) {
                    console.log("Setor deletado com sucesso!");
                    obterSetores(); 
                } else {
                    console.error('Erro ao deletar na API');
                }
            })
            .catch(function(erro) {
                console.error(`Erro na exclusão do setor: ${erro.message}`);
            });
        }
    }

function adicionarSetor() {
    var nomeInput = document.getElementById("campoSetor").value;
    var corredorInput = document.getElementById("campoCorredor").value; 
    var metaInput = document.getElementById("campoMeta").value;

    if (nomeInput == "" || corredorInput == "" || metaInput == "") {
        alert("Por favor, preencha todos os campos obrigatórios.");
        return;
    }

    for (var i = 0; i < loja.setores.length; i++) {
        var setorExistente = loja.setores[i];

        if (setorExistente.idCorredor == corredorInput) {
            alert("O corredor de número " + corredorInput + " já está sendo utilizado por outro setor! Escolha outro.");
            return; 
        }
    }

    fetch(`/gestao/cadastrarSetor`, { 
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            nomeSetor: nomeInput,
            idCorredor: corredorInput,
            meta: metaInput,
            fkLoja: codigoLoja
        })
    })
    .then(function(resposta) {
        if (resposta.ok) {
            console.log("Setor e corredor adicionados com sucesso!");
            document.getElementById("campoSetor").value = "";
            document.getElementById("campoCorredor").value = "";
            document.getElementById("campoMeta").value = "";
            
            obterSetores();
        } else {
            console.error('Erro ao cadastrar ou erro na API');
        }
    })
    .catch(function(erro) {
        console.error(`Erro no cadastro do setor: ${erro.message}`);
    });
}

    function exibirSetor() {
        let tabela = document.getElementById("tabelaSetores"); 
        tabela.innerHTML = "";
        for (var i = 0; i < loja.setores.length; i++){
            var setoresLoja = loja.setores[i];

            var corredorExibicao = setoresLoja.idCorredor ? setoresLoja.idCorredor : "Não informado";

            tabela.innerHTML += `
            <tr>
                <td>${setoresLoja.nomeSetor}</td>
                <td>${corredorExibicao}</td> <td>${setoresLoja.meta}</td>
                <td>
                    <button class="botao-excluir" onclick="excluirSetor(${setoresLoja.idSetor})">Excluir</button>
                </td>
            </tr>
            `;  
        }
    }

    function sairTela() {
        if (confirm("Deseja sair desta tela?")) {
            window.location.href = "../public/index.html";
        } 
    }
</script>
