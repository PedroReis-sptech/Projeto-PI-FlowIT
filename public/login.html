<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Flow</title>
<link rel="stylesheet" href="css/stylesCad-Log.css">
</head>
<body>

<div class="container">

  <div class="esquerdo">

      <h1>Flow</h1>
      <h2>Bem-vindo de volta!</h2>
      <hr>
      <p>Gerencie sua loja com mais organização e clareza. Acesse sua conta e continue de onde parou.</p> 
  </div>

  <div class="direito">
    <h1 class="login">LOGIN</h1>

    <div class="formulario">
      <div class="input-group">
        <input type="text" id="inputEmail" placeholder="Email">
      </div>

      <div class="input-group">
        <input type="password" id="inputSenha" placeholder="Senha">
      </div>

      <button class="botao" onclick="logar()">ENTRAR</button>

      <div class="link">
        Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
      </div>

      <div id="exibir"></div>
    </div>
  </div>

</div>
</body>
</html>

<script>
    function logar() {
        var email = inputEmail.value;
        var senhaInserida = inputSenha.value;
        var emailCorreto = "fernando.brandao@sptech.school";
        var senhaCorreta = "123";

        let mensagem = "";
        let acertosEmail = 0
        let acertosSenha = 0

        for(let i = 0; i < emailCorreto.length; i++) {
            if(email[i] == emailCorreto[i]){
              acertosEmail++;
            }
        }
        for(let i = 0; i < senhaCorreta.length; i++){
            if(senhaInserida[i] == senhaCorreta[i]){
              acertosSenha++;
            }
        }

        if(acertosEmail == emailCorreto.length && email.length == emailCorreto.length &&
        acertosSenha == senhaCorreta.length && senhaInserida.length == senhaCorreta.length){
          mensagem = `<p class="exibir sucesso">Login confirmado!</p>`;
          exibir.innerHTML = mensagem;
          setTimeout(() => {
            window.location.href = "dashboard/dashboard.html";
          }, 1000);
        }else{
          mensagem = `<p class="exibir erro">Senha e/ou Email inválidos.</p>`;
          exibir.innerHTML = mensagem;
        }

         console.log("FORM LOGIN: ", email);
        console.log("FORM SENHA: ", senhaInserida);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: email,
                senhaServer: senhaInserida
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nomeUsuario;
                    sessionStorage.ID_USUARIO = json.idUsuario;

                    setTimeout(function () {
                        window.location = "./dashboard/dashboard.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }
</script>
