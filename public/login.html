<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Flow</title>
<link rel="stylesheet" href="css/stylesCad-Log.css">
</head>
<body>

<div class="container">

  <div class="esquerdo">

      <h1>Flow</h1>
      <h2>Bem-vindo de volta!</h2>
      <hr>
      <p>Gerencie sua loja com mais organização e clareza. Acesse sua conta e continue de onde parou.</p> 
  </div>

  <div class="direito">
    <h1 class="login">LOGIN</h1>

    <div class="formulario">
      <div class="input-group">
        <input type="text" id="inputEmail" placeholder="Email">
      </div>

      <div class="input-group">
        <input type="password" id="inputSenha" placeholder="Senha">
      </div>

      <button class="botao" onclick="autenticar()">ENTRAR</button>

      <div class="link">
        Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
      </div>

      <div id="exibir"></div>
    </div>
  </div>

</div>
</body>
</html>

<script>
    function autenticar() {
    var email = inputEmail.value;
    var senha = inputSenha.value;

    exibir.innerHTML = "";

    if (email == "" || senha == "") {
        exibir.innerHTML = `<p class="exibir erro">Preencha todos os campos.</p>`;
        return false;
    }

    fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            emailServer: email,
            senhaServer: senha
        })
    })
    .then(function (resposta) {
        if (resposta.ok) {
            resposta.json().then(function (json) {
                sessionStorage.setItem("ID_USUARIO",    json.id);
                sessionStorage.setItem("EMAIL_USUARIO", json.email);
                sessionStorage.setItem("NOME_USUARIO",  json.nome);
                sessionStorage.setItem("CARGO",  json.cargo);
                exibir.innerHTML = `<p class="exibir sucesso">Login confirmado! Redirecionando...</p>`;

                setTimeout(function () {
                    if (json.cargo === "Gerente") {
                        window.location.href = "dashboard/dashboard_gerente.html";
                    }else if(json.cargo === "Suporte"){
                        window.location.href = "http://localhost:3333";
                    } else {
                        window.location.href = "dashboard/dashboard_consultor.html";
                    }
                }, 1000);
            });
        } else if (resposta.status === 403) {
            exibir.innerHTML = `<p class="exibir erro">Email e/ou senha inválidos.</p>`;
        } else {
            exibir.innerHTML = `<p class="exibir erro">Erro no servidor. Tente novamente.</p>`;
        }
    })
    .catch(function (erro) {
        console.error("Erro na requisição:", erro);
        exibir.innerHTML = `<p class="exibir erro">Não foi possível conectar ao servidor.</p>`;
    });

    return false;
}
</script>
