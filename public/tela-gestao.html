<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tela de Gerente - Flow</title>
    <link rel="stylesheet" href="css/stylesGestao.css">
</head>
<body>

    <div class="cabecalho">
        <div id="div_flow" class="logo">
            <img src="assets/imagens/Flow-removebg-preview.png" alt="Descrição" style="width:100%;">
        </div>
        <div class="links">
            <a href="dashboard/dashboard_gerente.html">DASHBOARD</a>
            <a href="#" class="link-ativo">GESTÃO DE USUÁRIO</a>
            <a href="tela-gestao-setor.html">GESTÃO DE SETOR</a>
        </div>
        <div class="botoes-topo">
            <button class="botao-sair" onclick="sairTela()">Sair</button>
        </div>
    </div>

    <div class="corpo-da-pagina">
        

        <div class="quadrado-lista">
            <h3>LISTA DE COLABORADORES</h3>
            <table>
                <thead>
                    <tr>
                        <th>NOME</th>
                        <th>E-MAIL</th>
                        <th>FUNÇÃO</th>
                        <th>AÇÃO</th>
                    </tr>
                </thead>
                <div class="tabelaU"></div>
                <tbody id="tabeladados">
                    </tbody>
            </table>
        </div>

    </div>

</body>
</html>

<script>
    window.onload = gerenciar;

    function gerenciar() {
    var codigoLoja = sessionStorage.ID_LOJA;

    if (!codigoLoja) {
        console.error("ID da loja não encontrado no sessionStorage.");
        return;
    }

    fetch(`/gestaoUsuario/listarUsuarios/${codigoLoja}`, { cache: 'no-store' })
        .then(function(resposta) {
            if (resposta.ok) {
                resposta.json().then(function(dado) {
                    console.log(`Dados recebidos: ${JSON.stringify(dado)}`);
                    exibirTabela(dado);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
        .catch(function(erro) {
            console.error(`Erro na obtenção dos usuários: ${erro.message}`);
        });
}   

    function exibirTabela(dado) {
        var container = document.getElementById("tabeladados");
        container.innerHTML = "";

        for (var i = 0; i < dado.length; i++) {
        var usuario = dado[i];

        container.innerHTML += `
            <tr>
                <td>${usuario.nomeUsuario}</td>
                <td>${usuario.email}</td>
                <td>
                    <select onchange="alterarCargo(${usuario.idUsuario}, this.value)">
                        <option value="1" ${usuario.fkPermissao == 1 ? 'selected' : ''}>Gerente</option>
                        <option value="2" ${usuario.fkPermissao == 2 ? 'selected' : ''}>Consultor</option>
                        <option value="3" ${usuario.fkPermissao == 3 ? 'selected' : ''}>Suporte</option>
                    </select>
                </td>
                <td>
                    <button class="botao-excluir" onclick="remover(${usuario.idUsuario})">Excluir</button>
                </td>
            </tr>
        `;
    }
}

    function alterarCargo(idUsuario, novaPermissao) {
        fetch("/gestaoUsuario/alterarCargo", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idUsuario: idUsuario,
                fkPermissao: novaPermissao
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                alert("Cargo atualizado com sucesso!");
                gerenciar();
            } else {
                console.error("Erro ao atualizar cargo.");
            }
        }).catch(function (erro) {
            console.error(`Erro: ${erro.message}`);
        });
    }

    function remover(idUsuario) {
        if (confirm("Tem certeza que deseja excluir este usuário?")) {
            fetch(`/gestaoUsuario/deletarUsuario/${idUsuario}`, {
                method: "DELETE"
            }).then(function (resposta) {
                if (resposta.ok) {
                    alert("Usuário deletado com sucesso!");
                    gerenciar();
                } else {
                    console.error("Erro ao deletar usuário.");
                }
            }).catch(function (erro) {
                console.error(`Erro: ${erro.message}`);
            });
        }
    }

    function sairTela() {
        if (confirm("Deseja sair desta tela?")) {
            window.location.href = "../index.html";
        } 
    }
</script>
