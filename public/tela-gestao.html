<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tela de Gerente - Flow</title>
    <link rel="stylesheet" href="css/stylesGestao.css">
</head>
<body>

    <div class="cabecalho">
        <div id="div_flow" class="logo">
            <img src="assets/imagens/Flow-removebg-preview.png" alt="Descrição" style="width:100%;">
        </div>
        <div class="links">
            <a href="dashboard/dashboard.html">DASHBOARD</a>
            <a href="#" class="link-ativo">GESTÃO DE USUÁRIO</a>
            <a href="tela-gestao-setor.html">GESTÃO DE SETOR</a>
        </div>
        <div class="botoes-topo">
            <button class="botao-sair" onclick="sairTela()">Sair</button>
        </div>
    </div>

    <div class="corpo-da-pagina">
        

        <div class="quadrado-lista">
            <h3>LISTA DE COLABORADORES</h3>
            <table>
                <thead>
                    <tr>
                        <th>NOME</th>
                        <th>E-MAIL</th>
                        <th>FUNÇÃO</th>
                        <th>AÇÃO</th>
                    </tr>
                </thead>
                <tbody id="tabelaFuncionarios">
                    </tbody>
            </table>
        </div>

    </div>

</body>
</html>

<script>
let listaDeEquipe = [];

window.onload = exibirFunc();

function exibirFunc() {
    let tabela = tabelaFuncionarios;


        tabela.innerHTML += `
            <tr>
                <td>${funcionario.nomeFunc}</td>
                <td>${funcionario.emailFunc}</td>
                <td>${funcionario.funcaoFunc}</td>
                <td>
                    <button class="botao-excluir" onclick="remover(${i})">Excluir</button>
                </td>
            </tr>
        `;
    }

function sairTela() {
    if (confirm("Deseja sair desta tela?")) {
    window.location.href = "../Site Institucional/index.html";
} 
}

function remover(posicao) {
    listaDeEquipe.splice(posicao, 1);
    mostrarNaTela();
}
</script>
