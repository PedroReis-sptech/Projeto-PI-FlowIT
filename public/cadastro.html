<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/stylesCad-Log.css">
  <title>Cadastro Flow</title>
</head>

<body>

  <div class="container">

    <div class="esquerdo">

      <h1>Flow</h1>
      <h2>Junte-se a nós!</h2>
      <hr>
      <p>Comece a organizar sua loja de forma inteligente. Crie sua conta e leve seu fluxo para o próximo nível.</p>
      <br>
      <p>Já tem uma conta? <a href="login.html" class="link">Vá para o login!</a></p>
    </div>

    <div class="direito">
      <h1>CADASTRO</h1>

      <div class="formulario">
        <div class="input-group">
          <input type="text" id="inputCodigo" placeholder="Código de verificação">
        </div>

        <div class="input-group">
          <input type="text" id="inputEmpresa" placeholder="Nome">
        </div>

        <div class="input-group">
          <input type="text" id="inputEmail" placeholder="Email">
        </div>
        <div class="input-group">
          <input type="password" id="inputSenha" placeholder="Senha">
        </div>

        <div class="input-group">
          <input type="password" id="inputConfirmacao" placeholder="Confirmação de senha">
        </div>

        <button onclick="cadastrar()">Próximo</button>

        <div id="exibir" class="exibir"></div>

      </div>
    </div>

  </div>
</body>

</html>

<script>
  function cadastrar() {
    var codigo = inputCodigo.value
    var nome = inputEmpresa.value;
    var email = inputEmail.value;
    var senhaInserida = inputSenha.value;
    var confirmacao = inputConfirmacao.value;

    let temErro = false;

    if (nome == "" || email == "" || senhaInserida == "" || confirmacao == "") {
      exibir.innerHTML += `<p class="exibir erro">Todos os campos devem ser preenchidos</p>`;

      return false;
    }

    if (!email.includes('@') || !email.includes('.')) {
      exibir.innerHTML += `<p class="exibir erro">Email deve conter @ e .</p>`;

      return false;
    }

    if (senhaInserida !== confirmacao) {
      exibir.innerHTML += `<p class="exibir erro">Senhas divergentes</p>`;

      return false;
    }

    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        codigoServer: codigo,
        nomeServer: nome,
        emailServer: email,
        senhaServer: senhaInserida
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          exibir.innerHTML = `<p class="exibir sucesso">Cadastro confirmado!</p>`;

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();

        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });

    return false;

  }
</script>
