    let chartLinha, chartBarra, chartPizza, chartRosca;

    function inicializarGraficos() {
        const setor = document.getElementById('select-setor').value;
        const dados = dadosSetores[setor];

        chartLinha = new Chart(document.getElementById('graf-linha'), {
            type: 'line',
            options: { plugins: { title: { display: true, text: dados.linhaTitle, font: { size: 18 } } } },
            data: {
                labels: ['8:00', '9:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00'],
                datasets: [{ label: dados.label, data: dados.linha, backgroundColor: '#163460cf', borderWidth: 8, tension: 0.4, fill: true }]
            }
        });

        chartBarra = new Chart(document.getElementById('graf-barra'), {
            type: 'bar',
            options: {
                plugins: {
                    title: {
                        display: true,
                        text: 'Fluxo por Setor – Zonas Quentes e Frias',
                        font: { size: 18 }
                    },
                    tooltip: {
                        callbacks: {
                            label: function (context) {
                                return context.raw + '%';
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        ticks: {
                            callback: function (value) {
                                return value + '%';
                            }
                        }
                    }
                }
            },
            data: {

                        return "#00123d";                 // zona quente (vermelho fechado)
                    }),
                    borderRadius: 6
                }]
            }
        });

        chartPizza = new Chart(document.getElementById('graf-pizza'), {
            type: 'pie',
            options: { plugins: { title: { display: true, text: dados.pizzaTitle, font: { size: 18 } } } },
            data: {
                labels: ['08:00-12:00', '12:00-16:00', '16:00-20:00'],
                datasets: [{ data: dados.pizza, backgroundColor: colorspizza }]
            }
        });

        chartRosca = new Chart(document.getElementById('graf-rosca'), {
            type: 'polarArea',
            options: { plugins: { title: { display: true, text: 'Fluxo por dia da semana', font: { size: 18 } }, legend: { position: 'right' } } },
            data: {
                labels: ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'],
                datasets: [{ data: dados.rosca, backgroundColor: colorssemana }]
            }
        });
    }

    function atualizarGraficos() {
        const setor = document.getElementById('select-setor').value;
        const dados = dadosSetores[setor];
        chartLinha.options.plugins.title.text = dados.linhaTitle;
        chartBarra.options.plugins.title.text = 'Fluxo por Setor – Zonas Quentes e Frias';

        chartPizza.update();

<script>
    let resultadoAtivacaoSemanaAnterior;
    let resultadoAtivacaoAteODia;
    let metaDiaria;
    let quantRegistrosDia;

    function fetchAtivacaoSemanaAnterior() {
        return fetch(`/kpis/ativacaoSemanaAnterior`, { cache: 'no-store' })
            .then(function (response) {
                if (response.ok) {
                    return response.json().then(function (resultado) {
                        // console.log(`Dados recebidos Ativacao Semana Anterior: ${JSON.stringify(resultado)}`);

                        resultadoAtivacaoSemanaAnterior = resultado
                        return resultado;
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                    return null;
                }
            })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                return null;
            });
    }

    function fetchAtivacaoAteODia() {
        return fetch(`/kpis/ativacaoAteConsulta`, { cache: 'no-store' })
            .then(function (response) {
                if (response.ok) {
                    return response.json().then(function (resultado) {
                        // console.log(`Dados recebidos Ativacao Ate o Dia: ${JSON.stringify(resultado)}`);

                        resultadoAtivacaoAteODia = resultado
                        return resultado;
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                    return null;
                }
            })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                return null;
            });
    }

    // KPI 3 função -> (meta diaria - quant de registros do dia)
    function ativacoesParaMetaDiaria() {
        fetchMetaDiaria().then(function () {
            fetchSomaDosRegistrosDosSetoresNoDia().then(function () {
                const card = document.getElementById('cardDiaria');
                const icon = document.getElementById('iconeDiaria');

                let metaDiariaNum = metaDiaria[0].metaDiaria;
                let quantRegistrosDiaNum = quantRegistrosDia[0].Quant_Registros_Dia;

                var quantoFaltaMetaDiaria = Number(metaDiariaNum) - Number(quantRegistrosDiaNum);
                var quantoUltrapassouDiaria = Number(quantRegistrosDiaNum) - Number(metaDiariaNum);

                if (metaDiariaNum <= Number(quantRegistrosDiaNum)) {
                    spanQuantoFaltaMetaDiaria.innerHTML = `Parabens! Meta Diária Atingida<br>Ultrapassou em ${quantoUltrapassouDiaria} ativações`
                    icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#40FF40"><path d="M720-120H280v-520l280-280 50 50q7 7 11.5 19t4.5 23v14l-44 174h258q32 0 56 24t24 56v80q0 7-2 15t-4 15L794-168q-9 20-30 34t-44 14Zm-360-80h360l120-280v-80H480l54-220-174 174v406Zm0-406v406-406Zm-80-34v80H160v360h120v80H80v-520h200Z"/></svg>'
                    card.style.backgroundColor = '#086608'
                } else {
                    console.log(`Quanto falta para meta diária: ${quantoFaltaMetaDiaria}`)
                    spanQuantoFaltaMetaDiaria.innerHTML = `Faltam ${quantoFaltaMetaDiaria} ativações para atingir a meta diária`
                    icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FF4D4D"><path d="m40-120 440-760 440 760H40Zm138-80h604L480-720 178-200Zm330.5-51.5Q520-263 520-280t-11.5-28.5Q497-320 480-320t-28.5 11.5Q440-297 440-280t11.5 28.5Q463-240 480-240t28.5-11.5ZM440-360h80v-200h-80v200Zm40-100Z"/></svg>'
                    card.style.backgroundColor = '#531111'

                }

            })
        })
    }



    // para pegar a meta diaria eh so chamar fetchMetaDiaria()
    // o resultado puro pode ser encontrado em metaDiaria[0].metaDiaria depois de chamar o fetchMetaDiaria()

    // OBS: segue a estrutura de chamar o fetch e usar o .then igual ta nas funcoes das KPIs 1 e 4
    // fetchMetaDiaria().then(function () {coloca o codigo da funcao aqui}
    function fetchMetaDiaria() {
        return fetch(`/kpis/metaDiaria`, { cache: 'no-store' })
            .then(function (response) {
                if (response.ok) {
                    return response.json().then(function (resultado) {
                        console.log(`Dados recebidos de Meta Diaria: ${JSON.stringify(resultado)}`);

                        metaDiaria = resultado
                        return resultado;
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                    return null;
                }
            })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados Meta Diaria: ${error.message}`);
                return null;
            });
    }

    // eh so chamar fetchSomaDosRegistrosDosSetoresNoDia()

    // o resultado puro pode ser encontrado em quantRegistrosDia[0].Quant_Registros_Dia 
    //  depois de chamar o fetchMetaDiaria()
    // OBS: segue a estrutura de chamar o fetch e usar o .then igual ta nas funcoes das KPIs 1 e 4
    // fetchSomaDosRegistrosDosSetoresNoDia().then(function () {coloca o codigo da funcao aqui}

    // KPI 2
    function ativacoesParaMetaSemanal() {
        fetchMetaDiaria().then(function () {
            fetchAtivacaoAteODia().then(function () {

                const card = document.getElementById('cardSemanal');
                const icon = document.getElementById('iconeSemanal');

                let metaDiariaNum = metaDiaria[0].metaDiaria;
                let metaSemanal = metaDiariaNum * 7;

                let ativacoesAteHojeAlimenticio = resultadoAtivacaoAteODia[0].quantidade;
                let ativacoesAteHojeVestuario = resultadoAtivacaoAteODia[1].quantidade;
                let ativacoesAteHojeUtensilio = resultadoAtivacaoAteODia[2].quantidade;
                let ativacoesAteHojeEletronico = resultadoAtivacaoAteODia[3].quantidade;
                let ativacoesAteHojeHigiene = resultadoAtivacaoAteODia[4].quantidade;

                let somaRegistrosSetoresAteHoje = ativacoesAteHojeAlimenticio + ativacoesAteHojeVestuario + ativacoesAteHojeUtensilio + ativacoesAteHojeEletronico + ativacoesAteHojeHigiene


                var quantoFaltaMetaSemanal = Number(metaSemanal) - Number(somaRegistrosSetoresAteHoje);
                var quantoUltrapassouSemanal = Number(somaRegistrosSetoresAteHoje) - Number(metaSemanal);

                    card.style.backgroundColor = '#086608'

                    console.log(`Quanto falta para meta Semanal: ${quantoFaltaMetaSemanal}`)
                    spanQuantoFaltaMetaSemanal.innerHTML = `Faltam ${quantoFaltaMetaSemanal} ativações para atingir a meta semanal`
                    icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FF4D4D"><path d="m40-120 440-760 440 760H40Zm138-80h604L480-720 178-200Zm330.5-51.5Q520-263 520-280t-11.5-28.5Q497-320 480-320t-28.5 11.5Q440-297 440-280t11.5 28.5Q463-240 480-240t28.5-11.5ZM440-360h80v-200h-80v200Zm40-100Z"/></svg>'

        })

    function fetchSomaDosRegistrosDosSetoresNoDia() {
        return fetch(`/kpis/somaDosRegistrosSetoresDiario`, { cache: 'no-store' })
            .then(function (response) {
                if (response.ok) {
                    return response.json().then(function (resultado) {
                        console.log(`Soma de registros de todos os setores juntos do dia da consulta apenas: ${JSON.stringify(resultado)}`);

                        quantRegistrosDia = resultado
                        return resultado;
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                    return null;
                }
            })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados Soma dos Setores: ${error.message}`);
                return null;
            });

    function compararParaVerQualSetorDiminuiu() {
        fetchAtivacaoSemanaAnterior().then(function () {
            fetchAtivacaoAteODia().then(function () {
                // console.log(`Semana Anterior: ${JSON.stringify(resultadoAtivacaoSemanaAnterior)}`)
                // console.log(`Ate o dia: ${JSON.stringify(resultadoAtivacaoAteODia)}`)

                let ultimosSeteAlimenticio = resultadoAtivacaoSemanaAnterior[0].quantidade;
                let ultimosSeteVestuario = resultadoAtivacaoSemanaAnterior[1].quantidade;
                let ultimosSeteUtensilio = resultadoAtivacaoSemanaAnterior[2].quantidade;
                let ultimosSeteEletronico = resultadoAtivacaoSemanaAnterior[3].quantidade;
                let ultimosSeteHigiene = resultadoAtivacaoSemanaAnterior[4].quantidade;
